version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Propose a release only once it is a week old (security updates are not delayed):
    # compromised versions are usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      # Minor and patch updates in one pull request a week; major ones one by one.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
