<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive, in-browser lessons on image processing and deep learning: convolution, edges, segmentation, frequency filtering, CNNs, saliency, adversarial examples, autoencoders, U-Nets, diffusion and vision transformers." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Image Processing Playground" />
    <meta property="og:description" content="See how image processing works, one pixel at a time: 25 interactive, in-browser lessons, from convolution and edge detection to CNNs, diffusion and vision transformers." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Image Processing Playground" />
    <meta name="twitter:description" content="See how image processing works, one pixel at a time: 25 interactive, in-browser lessons on image processing and deep learning." />
    <meta name="color-scheme" content="dark" />
    <!--
      Everything (scripts, styles, fonts, MNIST data) is served from this origin.
      'wasm-unsafe-eval' lets TensorFlow.js compile its small WebAssembly helpers;
      blob: and data: images are uploaded files and generated demo images.
      (Headers such as X-Content-Type-Options cannot be set from a <meta> tag.)
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Image Processing Playground — See how image processing works, one pixel at a time.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
